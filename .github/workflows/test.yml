name: CI Testing

on:
    pull_request:
    # test main after every merge, as merging no longer releases
    push:
      branches:
        - main
    # allows this workflow to be reusable (e.g. by the build workflow)
    workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        # tox-gh-actions 3.5.0 fails to import with tox >= 4.67.14
        pip install "tox<4.67.14" tox-gh-actions
    - name: Run tox
      run: |
        tox
    - name: Upload to codecov
      if: ${{matrix.python-version == '3.12'}}
      uses: codecov/codecov-action@v6
      with:
        use_oidc: true
        fail_ci_if_error: true

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        # tox-gh-actions 3.5.0 fails to import with tox >= 4.67.14
        pip install "tox<4.67.14" tox-gh-actions
    - name: Run tox
      run: |
        tox -e lint

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        # tox-gh-actions 3.5.0 fails to import with tox >= 4.67.14
        pip install "tox<4.67.14" tox-gh-actions
    - name: Run tox
      run: |
        tox -e docs
