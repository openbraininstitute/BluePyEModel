name: Release

# Releases are made manually: run this workflow from the Actions tab on main,
# or push a version tag. Merging to main no longer releases.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to increase
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  call-test-workflow:
    # a manual release can only be made from main
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write
    uses: openbraininstitute/BluePyEModel/.github/workflows/test.yml@main

  build-and-publish:
    name: Build, publish on PyPI and make a GitHub release
    runs-on: ubuntu-latest
    needs: call-test-workflow
    environment:  # needed for pypi publication
      name: pypi
      url: https://pypi.org/p/bluepyemodel
    permissions:
      contents: write
      id-token: write  # needed for pypi publication
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Stop if this commit is already released
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          git fetch --tags --quiet
          released=$(git tag --points-at HEAD)
          if [ -n "$released" ]; then
            echo "::error::This commit is already released as $released. Merge new changes before releasing."
            exit 1
          fi

      - name: Create a new version tag
        uses: anothrNick/github-tag-action@1.64.0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: false
          DEFAULT_BUMP: ${{ inputs.bump }}

      - name: Build a source tarball and wheel
        run: |
            pip install build
            python -m build

      - name: Get and store tag from 'Create a new version tag' step
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: echo "TAG_NAME=${{ steps.tag.outputs.new_tag }}" >> $GITHUB_ENV
      - name: Get and store tag from triggered tag push
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          generate_release_notes: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
