[build-system]
requires = ["setuptools >= 64", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "bluepyemodel"
authors = [
    {name = "Blue Brain Project, EPFL"},
]
description="Blue Brain Python Electrical Modeling Pipeline"
readme = "README.rst"
license = {file = "LICENSE.txt"}
requires-python = ">= 3.11"
dynamic = ["version"]
dependencies = [
    "click",
    "numpy",
    "scipy>=1.16.1",
    "pandas",
    "ipyparallel>=6.3",
    "tqdm",
    "pyyaml",
    "gitpython",
    "bluepyopt>=1.14.10",
    "bluepyefe>=2.3.48",
    "neurom>=3.0",
    "efel>=5.5.5",
    "configparser",
    "neuron>=8.0",
    "morph_tool>=2.8",
    "morphio",
    "fasteners>=0.16",
    "jinja2>=3.0.3",
    "currentscape>=1.0.28",
    "h5py>=3.0",
    "pydantic>=2.0",
]
keywords=[
    "computational neuroscience",
    "simulation",
    "analysis",
    "parameters",
    "Blue Brain Project",
]
classifiers=[
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.optional-dependencies]
docs = [
    "graphviz",
    "sphinx>=8.2,<10",
    "obi-sphinx-theme>=2.0.0",
]
test = [
    "pytest>=6.2",
    "dictdiffer>=0.8",
]
all = [
    "pytest>=6.2",
    "dictdiffer>=0.8",
]

[project.urls]
Homepage = "https://github.com/openbraininstitute/BluePyEModel"

[project.scripts]
bluepyemodel = "bluepyemodel.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests",]

[tool.setuptools_scm]
version_scheme = "python-simplified-semver"
local_scheme = "no-local-version"
